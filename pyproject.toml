[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "corrlog-core"
version = "0.2.2"
description = "Agent Correction Record (ACR): cryptographically signed, tamper-evident records of agent self-disclosed mistakes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["cryptography>=41.0", "jsonschema[format-nongpl]>=4.18,<5"]

[project.optional-dependencies]
crewai = ["crewai>=0.100"]
langchain = ["langchain>=0.3"]
autogen = ["autogen-core>=0.4"]
proofagent = []

[tool.setuptools.packages.find]
include = ["corrlog_core*", "corrlog_crewai*", "corrlog_langchain*", "corrlog_autogen*", "corrlog_claude_code*", "corrlog_proofagent*"]

[tool.setuptools.package-data]
corrlog_core = ["schema/*.json"]
corrlog_claude_code = ["hooks.json"]
