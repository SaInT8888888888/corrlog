name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package (pulls cryptography)
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest rfc8785 "inspect-ai>=0.3"

      - name: Core test suite
        run: python tests/test_core.py

      - name: Adversarial test suite
        run: python tests/test_adversarial.py

      - name: Sink durability hardening regressions (F1/F2/F5)
        run: |
          python -m pip install pytest
          python -m pytest tests/test_sink_hardening.py -q

      - name: Cross-implementation verifier fixture
        run: python tests/test_fixture.py

      - name: ProofAgent adapter tests
        run: python tests/test_proofagent.py

      - name: Inspect adapter tests (needs inspect-ai)
        run: |
          pip install "inspect-ai>=0.3"
          python tests/test_inspect.py

      - name: End-to-end demo
        run: python examples/demo.py

      - name: Schema is valid JSON
        run: python -c "import json; json.load(open('corrlog_core/schema/acr-v1.json')); print('schema valid')"

      - name: Complete suite including release security gates
        run: python -m pytest tests -q
