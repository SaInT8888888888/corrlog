name: Publish corrlog-inspect to PyPI

on:
  push:
    tags:
      - "corrlog-inspect-v*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      # Required for trusted publishing (OpenID Connect) — no long-lived token.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build distributions
        working-directory: corrlog_inspect
        run: python -m build

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: corrlog_inspect/dist
