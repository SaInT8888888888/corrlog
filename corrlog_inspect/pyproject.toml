[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "corrlog-inspect"
version = "0.1.0"
description = "Inspect AI extension: emits signed Agent Correction Record (ACR) receipts on INCORRECT eval scores"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# inspect_ai is imported at module load (this is a Hooks subclass), so it is a
# hard dependency. corrlog-core is only needed at signing time (imported
# lazily inside CorrlogSigner.sign), so it ships as the optional `core` extra.
dependencies = ["inspect-ai>=0.3"]
# Pinned >=0.2.0: corrlog-core 0.1.x bundled this module inside the core
# distribution; 0.2.0+ is the clean split where corrlog-inspect is the sole
# owner of the corrlog_inspect package.
[project.optional-dependencies]
core = ["corrlog-core>=0.2.0"]

[project.entry-points.inspect_ai]
corrlog_inspect = "corrlog_inspect"

[tool.setuptools]
packages = ["corrlog_inspect"]

[tool.setuptools.package-dir]
corrlog_inspect = "."
